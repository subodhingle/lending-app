[package]
name = "lending_pool_v2"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils", "alloc"] }
collateral_token = { path = "../collateral_token", features = ["testutils"] }
debt_token = { path = "../debt_token", features = ["testutils"] }
flash_loan_pool = { path = "../flash_loan_pool", features = ["testutils"] }
flash_liquidator = { path = "../flash_liquidator", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
