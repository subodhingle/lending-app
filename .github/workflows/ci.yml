name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Job 1: Contract tests + build ──────────────────────────────────────────
  contract-test:
    name: Contract Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install stellar-cli (pre-built binary)
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Run all contract tests
        run: cargo test --all

      - name: Build all contracts (verify WASM compilation)
        run: stellar contract build

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 7

  # ── Job 2: Frontend build ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: contract-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Create .env with real contract IDs
        working-directory: frontend
        run: |
          cat > .env << 'EOF'
          VITE_COLLATERAL_TOKEN_ID=CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          VITE_DEBT_TOKEN_ID=CCL7AEFVYKZK6EZOMOLHZGGNCXO6TZTMOMMECLHKOK5D33VCNSPGOSY5
          VITE_LENDING_POOL_ID=CDXK7RV2X5SDLYIHDDZEE2FAAUUQZEVGIEB7QZC44YLEIMGWG6ESEUQZ
          VITE_NETWORK=testnet
          VITE_RPC_URL=https://soroban-testnet.stellar.org
          EOF

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Job 3: Deploy to Vercel (push to main only) ─────────────────────────────
  # Vercel auto-deploys via GitHub integration on every push to main.
  # Manual deploy job is disabled — add VERCEL_TOKEN, VERCEL_ORG_ID,
  # VERCEL_PROJECT_ID secrets to re-enable.
  # deploy:
  #   name: Deploy to Vercel
  #   ...
